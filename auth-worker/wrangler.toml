name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# nodejs_compat：百度翻译通用 API 的 MD5 签名需要 node:crypto
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Workers Logs：wrangler tail 看不到经 service binding 进来的请求，开启后服务端
# 采集全部调用（含绑定流量）的 console 输出，供出题/每日知识 [QUIZ_DIAG] 诊断用
[observability]
enabled = true

	[observability.logs]
	invocation_logs = true
	head_sampling_rate = 1

# D1 数据库（授权关系数据）
[[d1_databases]]
binding = "DB"
database_name = "auth-db"
database_id = "f8db6c43-7fbe-4747-a7b7-364a5ea09d30"

# KV 缓存（限流/撤销短缓存/激活挑战）
[[kv_namespaces]]
binding = "KV"
id = "5e2b3731a5284fedb9d17093a86218ea"

# Worker 间调用：避免 auth-worker 通过公网再次请求豆瓣代理 Worker
[[services]]
binding = "DOUBAN_WORKER"
service = "douban-movie-api"

# 与 app-config Pages 共用，崩溃日志由 auth-worker 直接写入
[[kv_namespaces]]
binding = "CRASH_LOGS"
id = "d6fc37992e6d47fc9fe45207923627a3"

# Brevo transactional email sender
# Secrets（通过 wrangler secret put 注入）
# JWT_SIGNING_KEY
# MIMO_API_KEY（MiMo 上游密钥；必须通过 wrangler secret put 注入，禁止写入源码）
# BREVO_API_KEY
# INVITE_TEST_BYPASS_KEY（仅供带测试请求头的邮件预览使用）
# DEVICE_RECOVERY_HMAC_KEY
# TRAKT_CLIENT_ID
# TRAKT_CLIENT_SECRET
# TMDB_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# DOUBAN_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# OMDb_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# TRAKT_CREDENTIALS_ENCRYPTION_KEY
# BAILIAN_API_KEY（阿里云百炼 Model Studio 新加坡业务空间的 OpenAI 兼容 key；用
# `wrangler secret put BAILIAN_API_KEY` 写入。可选 BAILIAN_BASE_URL 覆盖业务空间域名，
# 不配则用代码里的默认域名。免费额度按模型独立（每模型 1M token），用尽返 403
# AllocationQuota.FreeTierOnly，由 MODEL_FALLBACKS_BY_PROVIDER.bailian 自动换下一个模型）
# AGNES_API_KEYS（Agnes AI 多 key：兼容单值、JSON 数组、逗号/换行分隔；多 key 自动轮换容灾）
# MINIMAX_API_KEY（MiniMax 文本模型；走 aiportx 网关 https://api.aiportx.com/v1，可用
# MINIMAX_BASE_URL 覆盖域名。用 `wrangler secret put MINIMAX_API_KEY` 写入。只接 MiniMax-M3
# 一档，供应商优先级 bailian > minimax > zhipu > agnes > mimo，见 src/ai/minimax.ts 与 handler 的
# PROVIDER_LADDER）
# AI_DEFAULT_PROVIDER 在 [vars] 中配置（主路径 bailian：免费额度按模型独立发放，flash 档实测比智谱快 3~4 倍；
# 主模型不可用按 bailian > zhipu > agnes > mimo 轮替）；不在此处写密钥
# ADMIN_EMAIL
# ACCESS_TEAM_DOMAIN
# ACCESS_AUDIENCE
#
# 密钥代理 Secrets（原客户端 BuildConfig 内嵌，现迁移到 worker，避免反编译泄露）
# GITEE_ACCESS_TOKEN —— 豆瓣失败项/个人数据/详情池云端同步
# GITHUB_UPDATE_TOKEN —— GitHub Releases 更新检查
# BAIDU_APP_ID —— 百度翻译 appid
# BAIDU_SECRET_KEY —— 百度翻译通用 API MD5 签名密钥
# BAIDU_API_KEY —— 百度翻译 AI API Bearer token
# 崩溃日志现在由 auth-worker 直接写入共享 CRASH_LOGS KV，不再需要单独的上报 token。
# AI_VOICE_SAMPLES（可选私有 R2 binding；音色样本仅由 Worker 读取，不返回客户端）
# AI_AUDIO_CACHE：私有 R2 缓存桶，MP3 只通过签名 URL 播放；概念插图未单独绑定 AI_IMAGE_CACHE 时复用此桶，并用 daily-illustration-v1/ 前缀隔离
[[r2_buckets]]
binding = "AI_AUDIO_CACHE"
bucket_name = "tracktosearch-ai-audio"

[vars]
ENVIRONMENT = "production"
PUBLIC_SITE_ORIGIN = "https://tracktosearch.pages.dev"
AUDIO_PUBLIC_BASE_URL = "https://tracktosearch-gateway.pages.dev/gateway-api"
# 今日影视知识概念插图：生产已开启，独立于文字 AI 配额并按账号每日限流
AI_DAILY_ILLUSTRATION_ENABLED = "true"
AI_DAILY_ILLUSTRATION_DAILY_LIMIT = "10"
# 文本生成默认供应商：百炼（免费额度按模型独立、吞吐不受智谱账号级 40 字符/秒拖累）；
# 轮替顺序 bailian > zhipu > agnes > mimo，BAILIAN_API_KEY 未配置时自动落到 zhipu，不会整场降级。
AI_DEFAULT_PROVIDER = "bailian"
# Brevo 已验证的 Sender 地址
EMAIL_FROM = "TraktoSearch <Yu-Fengliang@outlook.com>"
EMAIL_REPLY_TO = "1577865546@qq.com"

[triggers]
# 每 6 小时刷新一次公开豆瓣榜单首屏并预热 ID 映射
crons = ["0 */6 * * *"]
