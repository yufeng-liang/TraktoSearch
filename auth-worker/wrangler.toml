name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# nodejs_compat：百度翻译通用 API 的 MD5 签名需要 node:crypto
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 数据库（授权关系数据）
[[d1_databases]]
binding = "DB"
database_name = "auth-db"
database_id = "f8db6c43-7fbe-4747-a7b7-364a5ea09d30"

# KV 缓存（限流/撤销短缓存/激活挑战）
[[kv_namespaces]]
binding = "KV"
id = "5e2b3731a5284fedb9d17093a86218ea"

# Worker 间调用：避免 auth-worker 通过公网再次请求豆瓣代理 Worker
[[services]]
binding = "DOUBAN_WORKER"
service = "douban-movie-api"

# 与 app-config Pages 共用，崩溃日志由 auth-worker 直接写入
[[kv_namespaces]]
binding = "CRASH_LOGS"
id = "d6fc37992e6d47fc9fe45207923627a3"

# Brevo transactional email sender
# Secrets（通过 wrangler secret put 注入）
# JWT_SIGNING_KEY
# MIMO_API_KEY（MiMo 上游密钥；必须通过 wrangler secret put 注入，禁止写入源码）
# BREVO_API_KEY
# INVITE_TEST_BYPASS_KEY（仅供带测试请求头的邮件预览使用）
# DEVICE_RECOVERY_HMAC_KEY
# TRAKT_CLIENT_ID
# TRAKT_CLIENT_SECRET
# TMDB_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# DOUBAN_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# OMDb_API_KEY（兼容单值、JSON 数组、逗号/换行分隔的多 key）
# TRAKT_CREDENTIALS_ENCRYPTION_KEY
# AGNES_API_KEYS（Agnes AI 多 key：兼容单值、JSON 数组、逗号/换行分隔；多 key 自动轮换容灾）
# AI_DEFAULT_PROVIDER 在 [vars] 中配置（agnes 优先，mimo 兜底）；不在此处写密钥
# ADMIN_EMAIL
# ACCESS_TEAM_DOMAIN
# ACCESS_AUDIENCE
#
# 密钥代理 Secrets（原客户端 BuildConfig 内嵌，现迁移到 worker，避免反编译泄露）
# GITEE_ACCESS_TOKEN —— 豆瓣失败项/个人数据/详情池云端同步
# GITHUB_UPDATE_TOKEN —— GitHub Releases 更新检查
# BAIDU_APP_ID —— 百度翻译 appid
# BAIDU_SECRET_KEY —— 百度翻译通用 API MD5 签名密钥
# BAIDU_API_KEY —— 百度翻译 AI API Bearer token
# 崩溃日志现在由 auth-worker 直接写入共享 CRASH_LOGS KV，不再需要单独的上报 token。
# AI_VOICE_SAMPLES（可选私有 R2 binding；音色样本仅由 Worker 读取，不返回客户端）
# AI_AUDIO_CACHE：私有 R2 缓存桶，MP3 只通过签名 URL 播放
[[r2_buckets]]
binding = "AI_AUDIO_CACHE"
bucket_name = "tracktosearch-ai-audio"

[vars]
ENVIRONMENT = "production"
PUBLIC_SITE_ORIGIN = "https://tracktosearch.pages.dev"
AUDIO_PUBLIC_BASE_URL = "https://tracktosearch-gateway.pages.dev/gateway-api"
# 文本生成默认供应商：agnes（免费，多 key 容灾）优先，上游失败自动回退 mimo
AI_DEFAULT_PROVIDER = "agnes"
# Brevo 已验证的 Sender 地址
EMAIL_FROM = "TraktoSearch <Yu-Fengliang@outlook.com>"
EMAIL_REPLY_TO = "1577865546@qq.com"

[triggers]
# 每 6 小时刷新一次公开豆瓣榜单首屏并预热 ID 映射
crons = ["0 */6 * * *"]
