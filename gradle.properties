# 代理参数放开发机的 $GRADLE_USER_HOME/gradle.properties（本机是 F:\.gradle），不放这里：
# CI runner 会一起吃到 127.0.0.1:7890，上面没这个代理，依赖下载连不上。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# 使用 AAPT2 daemon，避免每次资源任务重复启动编译器进程
android.aapt2DaemonMode=true

# Compose 编译指标/报告仅在专项分析时临时开启，默认关闭以减少 Kotlin 编译开销
kotlin.compose.compiler.metrics=false
kotlin.compose.compiler.reports=false
# Gradle 9.4+ IDE 同步并行；保留，不影响单模块命令行构建
org.gradle.tooling.parallel=true
