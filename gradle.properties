org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890

org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AGP 9.x 在 Windows 上 AAPT2 daemon 模式启动失败（"Daemon startup failed"），退回非 daemon 模式规避该 bug
android.aapt2DaemonMode=false

kotlin.compose.compiler.metrics=true
kotlin.compose.compiler.reports=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
