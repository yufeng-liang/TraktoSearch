<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackToSearch Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Ambient background -->
        <div class="ambient" aria-hidden="true">
            <div class="ambient-blob ambient-blob-1"></div>
            <div class="ambient-blob ambient-blob-2"></div>
            <div class="ambient-blob ambient-blob-3"></div>
        </div>

        <!-- Topbar -->
        <header class="topbar glass">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle" aria-label="切换侧栏" aria-controls="sidebar" aria-expanded="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="brand">
                    <img class="brand-mark" src="app-icon.png" alt="TrackToSearch">
                    TrackToSearch
                </span>
            </div>
            <nav class="topbar-nav" id="topbarNav">
                <a href="#/dashboard" class="nav-link" data-route="dashboard">仪表盘</a>
                <a href="#/friends" class="nav-link" data-route="friends">朋友</a>
                <a href="#/audit" class="nav-link" data-route="audit">审计日志</a>
            </nav>
            <div class="topbar-right">
                <button class="palette-btn" id="paletteBtn" aria-label="主题配色" aria-controls="palettePanel" aria-expanded="false">
                    <span class="palette-current" id="paletteCurrent"></span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="palette-panel glass" id="palettePanel" hidden></div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <span class="theme-icon theme-icon-sun" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </span>
                    <span class="theme-icon theme-icon-moon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                </button>
                <span class="admin-email" id="adminEmail">未登录</span>
                <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
            </div>
        </header>

        <div class="layout">
            <!-- Sidebar -->
            <aside class="sidebar glass" id="sidebar">
                <ul class="sidebar-list">
                    <li>
                        <a href="#/dashboard" class="sidebar-link" data-route="dashboard">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            </span>
                            <span>仪表盘</span>
                        </a>
                    </li>
                    <li>
                        <a href="#/friends" class="sidebar-link" data-route="friends">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </span>
                            <span>朋友</span>
                        </a>
                    </li>
                    <li>
                        <a href="#/audit" class="sidebar-link" data-route="audit">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            </span>
                            <span>审计日志</span>
                        </a>
                    </li>
                </ul>
                <div class="sidebar-footer">
                    <div class="sidebar-status">
                        <span class="status-dot"></span>
                        <span>网关在线</span>
                    </div>
                </div>
            </aside>

            <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭侧栏" hidden></button>

            <!-- Main -->
            <main class="main" id="mainContent"></main>
        </div>

        <!-- Toast container -->
        <div class="toast-container" id="toastContainer" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- Modal container -->
        <div class="modal-overlay" id="modalOverlay" hidden>
            <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <header class="modal-header">
                    <h3 id="modalTitle">标题</h3>
                    <button class="modal-close" id="modalClose" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>
                <div class="modal-body" id="modalBody"></div>
                <footer class="modal-footer" id="modalFooter"></footer>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260724-friend-edit-v1"></script>
</body>
</html>
