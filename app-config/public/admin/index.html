<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#141821">
    <title>TrackToSearch Admin</title>
    <link rel="icon" type="image/png" href="app-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260928-mobile-v1">
</head>
<body>
    <div id="app">
        <!-- Ambient background -->
        <div class="ambient" aria-hidden="true">
            <div class="ambient-blob ambient-blob-1"></div>
            <div class="ambient-blob ambient-blob-2"></div>
            <div class="ambient-blob ambient-blob-3"></div>
        </div>

        <!-- Topbar -->
        <header class="topbar glass">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle" aria-label="打开更多页面" aria-controls="sidebar" aria-expanded="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="brand">
                    <img class="brand-mark" src="app-icon.png" alt="TrackToSearch">
                    <span class="brand-text">TrackToSearch</span>
                </span>
                <span class="topbar-status" aria-label="网关状态">
                    <span class="status-dot" id="gatewayStatusDot"></span>
                    <span class="status-text" id="gatewayStatusText">网关在线</span>
                </span>
            </div>
            <div class="topbar-right">
                <button class="palette-btn" id="paletteBtn" aria-label="主题配色" aria-controls="palettePanel" aria-expanded="false">
                    <span class="palette-current" id="paletteCurrent"></span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="palette-panel glass" id="palettePanel" hidden></div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <span class="theme-icon theme-icon-sun" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </span>
                    <span class="theme-icon theme-icon-moon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                </button>
                <span class="admin-email" id="adminEmail">未登录</span>
                <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
            </div>
        </header>

        <div class="layout">
            <!-- Sidebar -->
            <aside class="sidebar glass" id="sidebar">
                <p class="sidebar-heading">更多页面</p>
                <ul class="sidebar-list">
                    <li data-tab-dup>
                        <a href="#/dashboard" class="sidebar-link" data-route="dashboard">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            </span>
                            <span>仪表盘</span>
                        </a>
                    </li>
                    <li data-tab-dup>
                        <a href="#/ai-health" class="sidebar-link" data-route="ai-health">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                            </span>
                            <span>AI 健康</span>
                        </a>
                    </li>
                    <li data-tab-dup>
                        <a href="#/friends" class="sidebar-link" data-route="friends">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </span>
                            <span>用户</span>
                        </a>
                    </li>
                    <li>
                        <a href="#/audit" class="sidebar-link" data-route="audit">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            </span>
                            <span>审计日志</span>
                        </a>
                    </li>
                    <li data-tab-dup>
                        <a href="#/feedback" class="sidebar-link" data-route="feedback">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            </span>
                            <span>反馈管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="#/crash-logs" class="sidebar-link" data-route="crash-logs">
                            <span class="sidebar-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v2m0 4h.01"/><path d="M21 12c0 5-4 9-9 9s-9-4-9-9"/></svg>
                            </span>
                            <span>崩溃日志</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭侧栏" hidden></button>

            <!-- Main -->
            <main class="main" id="mainContent"></main>
        </div>

        <!-- 手机端底部标签栏：拇指热区放主入口，剩余页面与外观设置走「更多」抽屉 -->
        <nav class="tabbar" id="tabbar" aria-label="主导航">
            <a href="#/dashboard" class="tab-link" data-route="dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>仪表盘</span>
            </a>
            <a href="#/ai-health" class="tab-link" data-route="ai-health">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                <span>AI 健康</span>
            </a>
            <a href="#/feedback" class="tab-link" data-route="feedback">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>反馈</span>
            </a>
            <a href="#/friends" class="tab-link" data-route="friends">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>用户</span>
            </a>
            <button type="button" class="tab-link tab-more" id="tabMore" aria-controls="sidebar" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                <span>更多</span>
            </button>
        </nav>

        <!-- Toast container -->
        <div class="toast-container" id="toastContainer" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- Modal container -->
        <div class="modal-overlay" id="modalOverlay" hidden>
            <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <header class="modal-header">
                    <h3 id="modalTitle">标题</h3>
                    <button class="modal-close" id="modalClose" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>
                <div class="modal-body" id="modalBody"></div>
                <footer class="modal-footer" id="modalFooter"></footer>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260928-mobile-v1"></script>
</body>
</html>
