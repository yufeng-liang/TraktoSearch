name: Build release APK

# 触发方式两条：
#   1. on: release: types: [published] —— 正式发版。本地只负责提交/版本号/tag/中文日志/
#      建 Release，构建与分发全在这里：签名 APK → 本仓库 Release 附件 + R2，
#      最后把 manifest/latest.json 指针移过去。
#   2. workflow_dispatch —— 传 tag 或分支 ref 做构建验证；publish 开关默认 false，
#      即「影子构建」，只出 artifact 不碰任何线上对象。
#
# 写入顺序是有意的：不可变对象（APK / mapping / manifest/v<name>.json）先写，
# 全量日志其次，指针 manifest/latest.json 最后。任何一步失败都停在「线上仍是旧版」，
# 不会出现「有更新提示但下载 404」。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用 tag（如 v3.6.0）；传分支 ref 则进入自检模式，版本号取自代码"
        required: true
        type: string
      publish:
        description: "true 时把产物推到 GitHub Release 附件与 R2（清单指针最后写）。默认只构建。"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: assembleRelease
    # 钉住版本而不是 ubuntu-latest：GH 已公告 ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，
    # 换镜像会连带换掉预装的 SDK/构建工具版本，发布流水线不该在无人改动时被动变环境。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 保留 environment 是为了以后加审批时不用改作业结构；但当前账号套餐（私有仓 + Free）
    # 不支持 required reviewers，实测 PUT 返回 422，环境建成了裸的、不拦任何东西。
    # 所以现在真正的闸门只有两个：手动 dispatch，以及「人工 publish release」这一步。
    environment: production
    # gh release upload 要往本仓库挂附件，只有这个作业需要写权限，故不开在 workflow 级
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag }}
      # 官网与应用内共同读的清单域，也是回读校验的靶子
      SITE_ORIGIN: https://tracktosearch.pages.dev
      R2_BUCKET: tracktosearch-releases
      # 与本机验证过的版本对齐；不固定版本会让发版流水线跟着 wrangler 漂移
      WRANGLER_VERSION: 4.118.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 这里刻意不用 ${{ env.RELEASE_REF }}：with: 里能不能读 env 是个上下文可用性的坑，
          # 而 checkout 拿错 ref 的后果是构建错的树、把不对的包发出去。内联表达式没有歧义。
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: 解析版本号
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*)
              # 正式路径：tag 版本号必须与 DSL 里的 versionName 一致，
              # 不一致由 verifyReleaseVersion 直接构建失败
              echo "EXPECTED_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
              ;;
            *)
              # 自检路径：CI 辅助文件（.ci/…）只存在于较新的提交里，拿历史 tag 验证流水线
              # 会缺文件；这里允许传分支 ref，版本号从被检出的代码里读，只证明构建链通，
              # 不代表发版。真实发版一定走上面的 v* 分支。
              # 用 awk 而不是 sed|head：set -o pipefail 下 head 提前关管道会让 sed 吃 SIGPIPE
              # 以 141 退出，把「成功取到版本号」变成步骤失败。
              version="$(awk -F'"' '/^[[:space:]]*versionName = /{print $2; exit}' app/build.gradle.kts)"
              [ -n "$version" ] || { echo "::error::无法从 app/build.gradle.kts 解析 versionName"; exit 1; }
              echo "::notice::自检模式（ref=$TAG），versionName 取自代码：$version"
              echo "EXPECTED_VERSION_NAME=$version" >> "$GITHUB_ENV"
              if [ "$PUBLISH" = "true" ]; then
                echo "::error::自检模式（ref 不是 v* tag）不允许发布，产物来源不可追溯"
                exit 1
              fi
              ;;
          esac

      - name: 校验签名材料齐备
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          AES_KEY: ${{ secrets.CONFIG_AES_KEY }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::缺少 Secret $1"
              missing=1
            fi
          }
          check RELEASE_KEYSTORE_B64 "$KEYSTORE_B64"
          check RELEASE_STORE_PASSWORD "$STORE_PASSWORD"
          check RELEASE_KEY_ALIAS "$KEY_ALIAS"
          check RELEASE_KEY_PASSWORD "$KEY_PASSWORD"
          check CONFIG_AES_KEY "$AES_KEY"
          if [ "$PUBLISH" = "true" ]; then
            check CF_API_TOKEN "$CF_TOKEN"
            check CF_ACCOUNT_ID "$CF_ACCT"
          fi
          exit "$missing"

      - name: 还原签名材料与构建配置
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          AES_KEY: ${{ secrets.CONFIG_AES_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          chmod 600 release.jks
          # 键名与 app/build.gradle.kts 读取的严格对应。
          # 不写 sdk.dir：runner 用镜像自带的 ANDROID_HOME。
          cat > local.properties <<EOF
          release.store.file=../release.jks
          release.store.password=$STORE_PASSWORD
          release.key.alias=$KEY_ALIAS
          release.key.password=$KEY_PASSWORD
          config.aes.key=$AES_KEY
          EOF

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          # AGP 9.x 的最低 JDK；升 AGP 时按官方兼容表复核
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 组件
        # 不用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，而 tools 包
        # 已从 SDK 仓库移除，实测报 "Failed to find package 'tools'" 后 exit 1，整条流水线
        # 挂在这一步。runner 镜像自带 SDK 且设了 ANDROID_HOME，这里只补
        # compileSdkVersion("android-37.2") 需要的扩展级平台；装不上就在这一步明确失败，
        # 而不是拖到依赖解析阶段报一句看不懂的话。
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          fi
          [ -n "$sdkmanager" ] || { echo "::error::runner 镜像里找不到 sdkmanager"; exit 1; }
          echo "使用 sdkmanager：$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-37.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: assembleRelease
        # -I 的 init script 把官方源前置到国内镜像之前，绕开 CI 空缓存下阿里云缺构件的坑，
        # 详见 .ci/gradle-ci.init.gradle.kts
        #
        # chmod 不能省：构建 checkout 的是 tag 的内容，历史 tag 里 gradlew 仍是 100644
        # （Windows 工作树 core.fileMode=false 丢了执行位），master 上补的执行位对旧 tag 无效，
        # 直接 ./gradlew 会报 Permission denied / exit 126。
        run: |
          chmod +x ./gradlew
          init_script=".ci/gradle-ci.init.gradle.kts"
          if [ ! -f "$init_script" ]; then
            echo "::error::$init_script 不在被检出的这棵树里（历史 tag 上还没有它）。要验证流水线请传分支 ref，正式发版则不受影响。"
            exit 1
          fi
          ./gradlew :app:assembleRelease --stacktrace -I "$GITHUB_WORKSPACE/$init_script"

      - name: 校验产物签名指纹
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          fingerprint="$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "APK 签名证书 SHA-256：$fingerprint"
          # 与 app/build.gradle.kts 里 VerifyReleaseSigningTask 校验的是同一枚证书；
          # 那边查的是「用的 keystore 对不对」，这边查「发出去的包真是它签的吗」。
          expected=5ece267c52985b64bd23f40f5be6a8732e5689b10248fa7846e9e16f8cf5adb8
          [ "$fingerprint" = "$expected" ] || { echo "::error::产物签名指纹与发布证书不符"; exit 1; }

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.event.release.tag_name || inputs.tag }}
          path: out/
          retention-days: 30

      - name: Upload R8 mapping
        # R8 fullMode 下的线上崩溃栈只有这份 mapping 能解，先随 artifact 留存
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.event.release.tag_name || inputs.tag }}
          path: app/build/outputs/mapping/release/
          retention-days: 90

      # ============================================================
      # 以下全部只在 publish 打开时跑
      # ============================================================

      - name: 汇总产物元数据
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          script=".ci/make-manifest.mjs"
          [ -f "$script" ] || { echo "::error::$script 不在被检出的这棵树里，无法生成清单"; exit 1; }
          apk="out/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          vc=$(awk '/^[[:space:]]*versionCode = /{print $3; exit}' app/build.gradle.kts)
          ms=$(awk '/^[[:space:]]*minSdk = /{print $3; exit}' app/build.gradle.kts)
          {
            echo "APK_SHA256=$sha"
            echo "APK_SIZE=$size"
            echo "APK_VERSION_CODE=$vc"
            echo "APK_MIN_SDK=$ms"
          } >> "$GITHUB_ENV"
          echo "APK sha256=$sha size=$size versionCode=$vc minSdk=$ms"

      - name: 取 Release 正文与日期
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_REF" --json tagName,createdAt,body > release.json
          # 存原始正文，不预先加「## vX.X.X 更新内容（日期）」标题：App 侧
          # injectDateIntoChangelog 会自己按 releaseDate 补，多包一层就是重复标题
          node -e 'const r=JSON.parse(require("fs").readFileSync("release.json","utf8"));process.stdout.write(r.body || "")' > changelog.md
          created=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("release.json","utf8")).createdAt)')
          # 日期取东八区那天，与迁移前 App 展示一致（旧解析器用设备时区，16:00Z 之后会显示成次日）
          echo "RELEASE_DATE=$(TZ=Asia/Shanghai date -d "$created" +%F)" >> "$GITHUB_ENV"
          echo "正文 $(wc -c < changelog.md) 字节，releaseDate=$RELEASE_DATE"

      - name: 生成分版清单与全量日志
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ env.EXPECTED_VERSION_NAME }}
          VERSION_CODE: ${{ env.APK_VERSION_CODE }}
          FILE_NAME: TraktoSearch-v${{ env.EXPECTED_VERSION_NAME }}.apk
          SHA256: ${{ env.APK_SHA256 }}
          SIZE: ${{ env.APK_SIZE }}
          MIN_SDK: ${{ env.APK_MIN_SDK }}
          CHANGELOG_ZH_FILE: changelog.md
        run: |
          set -euo pipefail
          mkdir -p manifest
          node .ci/make-manifest.mjs latest --out "manifest/v${VERSION_NAME}.json"
          # 全量日志每次发版重算：清单是唯一真相，不留增量合并的边界情况
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate > releases.json
          node .ci/make-manifest.mjs history --releases releases.json --out manifest/history.json
          cp "manifest/v${VERSION_NAME}.json" manifest/latest.json
          ls -l manifest/

      - name: 版本单调断言（写任何对象之前）
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          code=$(curl -s -o live.json -w '%{http_code}' "$SITE_ORIGIN/manifest/latest.json" || echo 000)
          case "$code" in
            404)
              echo "::notice::线上还没有清单（首次发布），跳过单调断言"
              ;;
            200)
              live=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("live.json","utf8")).latest.versionCode)')
              echo "线上 versionCode=$live，本次 $APK_VERSION_CODE"
              # 挡住两类事故：dry-run 产物顶掉线上真版本；同一 versionCode 出两个不同的包
              # （App 侧 hasUpdate 只比 versionName，同号不同包会让用户拿到对不上校验值的 APK）
              [ "$APK_VERSION_CODE" -gt "$live" ] || {
                echo "::error::versionCode 未超过线上 $live，拒绝发布。请确认版本号已递增、且本次不是重跑旧 tag"; exit 1; }
              ;;
            *)
              # 读不到线上清单就当失败：跳过断言等于把闸门拆了
              echo "::error::读 $SITE_ORIGIN/manifest/latest.json 失败（HTTP $code），无法做版本单调断言"; exit 1
              ;;
          esac

      - name: 准备 wrangler
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION"
          wrangler --version

      - name: 推 GitHub Release 附件
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 主仓库 Release 附件保留作为镜像：Functions 挂掉时官网次按钮与应用降级链都指这里
          gh release upload "$RELEASE_REF" "out/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk" --clobber

      - name: 上传不可变产物到 R2
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # --remote 必须显式带：wrangler 的 r2 object 子命令默认读写本机 .wrangler/state，
          # 不加会打印 "Upload complete." 而云上什么都没有。put-remote() 顺手把这行日志
          # 断言掉，让「写到本地」直接失败而不是静默通过。
          put-remote() {
            local key="$1" file="$2" ctype="$3"
            # 2>&1：'Resource location:' 走哪条流不该由我猜，两条都收下再断言
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --content-type "$ctype" --remote 2>&1 \
              | tee /tmp/put.log
            grep -q 'Resource location: remote' /tmp/put.log || {
              echo "::error::写 $key 时没看到 'Resource location: remote'，可能落到本机 state 而非云上"; exit 1; }
          }
          # mapping 走私有前缀：站点函数只暴露 /dl/*.apk 与 /manifest/*.json，
          # 这个前缀从公网取不到，但 R8 fullMode 的线上崩溃栈必须长期可解
          gzip -c app/build/outputs/mapping/release/mapping.txt > mapping.txt.gz
          put-remote "apk/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk" \
            "out/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk" "application/vnd.android.package-archive"
          put-remote "mapping/${EXPECTED_VERSION_NAME}/mapping.txt.gz" mapping.txt.gz "application/gzip"
          put-remote "manifest/v${EXPECTED_VERSION_NAME}.json" "manifest/v${EXPECTED_VERSION_NAME}.json" "application/json"
          put-remote "manifest/history.json" manifest/history.json "application/json"

      - name: 移动清单指针（最后一步，即回滚点）
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 指针可覆写就是回滚手段：manifest/v<旧版本>.json 还在，把它重新 put 成
          # latest.json 即可退回，APK 对象一个都不用删。
          wrangler r2 object put "$R2_BUCKET/manifest/latest.json" \
            --file manifest/latest.json --content-type "application/json" --remote 2>&1 | tee /tmp/put.log
          grep -q 'Resource location: remote' /tmp/put.log || {
            echo "::error::latest.json 没写到云上"; exit 1; }

      - name: 发布后回读校验
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          got=$(curl -fsS "$SITE_ORIGIN/manifest/latest.json")
          echo "$got" | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8")).latest;
            const want = process.env;
            const bad = [];
            if (m.versionName !== want.EXPECTED_VERSION_NAME) bad.push(`versionName ${m.versionName}`);
            if (m.sha256 !== want.APK_SHA256) bad.push(`sha256 ${m.sha256}`);
            if (String(m.size) !== want.APK_SIZE) bad.push(`size ${m.size}`);
            if (bad.length) { console.error("::error::回读与产物不一致：" + bad.join(", ")); process.exit(1); }
            console.log("清单回读一致：", m.versionName, m.url);
          '
          # 直链必须带 Content-Length：应用内进度条拿不到总量会退化成不确定的转圈。
          # 先 tr -d '\r'：HTTP 头以 CRLF 结尾，留着 \r 的话 "$" 锚点永远匹配不上。
          head=$(curl -sIL "$SITE_ORIGIN/dl/TraktoSearch-v${EXPECTED_VERSION_NAME}.apk" | tr -d '\r')
          echo "$head" | grep -qi '^content-length: *'"${APK_SIZE}$'" \
            || { echo "::error::直链响应缺 Content-Length 或体积不符"; echo "$head"; exit 1; }
          echo "$head" | grep -qi 'attachment; filename=' \
            || { echo "::error::直链响应没有 Content-Disposition attachment"; exit 1; }
