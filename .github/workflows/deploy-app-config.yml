name: Deploy app-config

on:
  push:
    branches: [master]
    paths:
      - 'app-config/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pages
    steps:
      - uses: actions/checkout@v6

      - name: Setup config.plain.json
        env:
          APP_CONFIG_PLAIN: ${{ secrets.APP_CONFIG_PLAIN }}
        run: |
          set -euo pipefail
          printf '%s' "$APP_CONFIG_PLAIN" > scripts/config.plain.json

          # 兼容 GitHub Secret 中保存的原文 JSON 和 Base64(JSON) 两种格式。
          if node -e "JSON.parse(require('fs').readFileSync('scripts/config.plain.json', 'utf8'))"; then
            echo 'config.plain.json 使用原文 JSON'
          else
            base64 --decode scripts/config.plain.json > scripts/config.plain.json.decoded
            mv scripts/config.plain.json.decoded scripts/config.plain.json
            node -e "JSON.parse(require('fs').readFileSync('scripts/config.plain.json', 'utf8'))"
            echo 'config.plain.json 已从 Base64 解码'
          fi
        working-directory: app-config

      - name: Install deps
        run: npm install
        working-directory: app-config/scripts

      - name: Encrypt config
        run: npm run encrypt
        working-directory: app-config/scripts
        env:
          CONFIG_AES_KEY: ${{ secrets.CONFIG_AES_KEY }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=app-config --branch ${{ github.ref_name }}
          workingDirectory: app-config
