@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ===== TrackToSearch Official Website — Editorial Swiss Revival ===== */
/* Color tokens per design spec §7.1 */
:root {
  /* Brand palette */
  --tts-paper: #F6F2E9;
  --tts-paper-deep: #E9E2D4;
  --tts-ink: #1D1C19;
  --tts-ink-muted: #6D685F;
  --tts-ink-faint: #9B9588;
  --tts-line: #C9C0B2;
  --tts-line-soft: #D9D2C6;
  --tts-ticket: #D95532;
  --tts-ticket-dark: #A83E27;
  --tts-ticket-soft: rgba(217, 85, 50, 0.08);

  /* Semantic aliases for head contract */
  --tts-background: var(--tts-paper);
  --tts-foreground: var(--tts-ink);
  --tts-card: var(--tts-paper-deep);
  --tts-card-foreground: var(--tts-ink);
  --tts-popover: var(--tts-paper);
  --tts-popover-foreground: var(--tts-ink);
  --tts-primary: var(--tts-ticket);
  --tts-primary-foreground: #FFFFFF;
  --tts-secondary: var(--tts-paper-deep);
  --tts-secondary-foreground: var(--tts-ink);
  --tts-muted: var(--tts-paper-deep);
  --tts-muted-foreground: var(--tts-ink-muted);
  --tts-accent: var(--tts-paper-deep);
  --tts-accent-foreground: var(--tts-ink);
  --tts-border: var(--tts-line);
  --tts-input: var(--tts-line);
  --tts-ring: var(--tts-ticket);
  --tts-destructive: #B5432A;
  --tts-destructive-foreground: #FFFFFF;

  /* Radius scale */
  --tts-radius-sm: 2px;
  --tts-radius-md: 4px;
  --tts-radius-lg: 8px;
  --tts-radius-xl: 0px;

  /* Typography */
  --tts-font-serif: "Fraunces", "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --tts-font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --tts-font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Consolas", Menlo, monospace;
}

  }
